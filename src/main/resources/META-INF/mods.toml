modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Required: this is a RoadWeaver addon.
[[dependencies.${mod_id}]]
    modId="roadweaver"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with Zones installed, RoadWeaver's GPU terrain sampling accounts for flattened zones.
[[dependencies.${mod_id}]]
    modId="zones"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config = "${mod_id}.mixins.json"
